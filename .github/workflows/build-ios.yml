name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Godot
      uses: godotengine/godot-action/setup@v4
      with:
        version: '4.7.1.stable'
        with-editor: false
    
    - name: Export iOS IPA
      uses: godotengine/godot-action/export@v4
      with:
        godot-version: '4.7.1.stable'
        export-preset: 'iOS'
        custom-template: ''
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZombieSurvivor-iOS
        path: export_output/ios/*.ipa
        retention-days: 30
